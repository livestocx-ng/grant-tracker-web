<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Grant Tracker">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a9a8f"/>
      <stop offset="0.55" stop-color="#0f6b63"/>
      <stop offset="1" stop-color="#0a4540"/>
    </linearGradient>
    <linearGradient id="sheen" x1="16" y1="6" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="22" y1="18" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7f3ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#fff" stroke-opacity="0.14"/>
  <path d="M16 6c12-4 28-2 36 8 2 8-2 18-10 24" stroke="url(#sheen)" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- Grant document -->
  <g filter="url(#glow)">
    <path
      d="M22 16.5h14.2c.6 0 1.2.2 1.6.7l6 6.2c.4.4.6 1 .6 1.6V46c0 1.4-1.1 2.5-2.5 2.5H22c-1.4 0-2.5-1.1-2.5-2.5V19c0-1.4 1.1-2.5 2.5-2.5Z"
      fill="url(#mark)"
      fill-opacity="0.96"
    />
    <path d="M36.5 16.8V23c0 .8.7 1.5 1.5 1.5h5.8" fill="#c5ebe6"/>
    <!-- Tracker lines -->
    <rect x="25" y="28" width="14" height="2.2" rx="1.1" fill="#0f6b63" opacity="0.35"/>
    <rect x="25" y="33.5" width="10" height="2.2" rx="1.1" fill="#0f6b63" opacity="0.28"/>
    <rect x="25" y="39" width="12" height="2.2" rx="1.1" fill="#0f6b63" opacity="0.22"/>
  </g>

  <!-- Status check seal -->
  <circle cx="44.5" cy="42.5" r="9.5" fill="#0a4540"/>
  <circle cx="44.5" cy="42.5" r="8" fill="#1a9a8f"/>
  <path
    d="M40.4 42.4l2.5 2.5 5.7-5.8"
    stroke="#fff"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
